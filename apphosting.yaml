kind: apphosting.yaml
version: v1
runConfig:
  cpu: 1
  memoryMiB: 512
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_WITH_YOUR_FIREBASE_API_KEY"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_WITH_YOUR_FIREBASE_AUTH_DOMAIN"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_WITH_YOUR_FIREBASE_PROJECT_ID"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "REPLACE_WITH_YOUR_FIREBASE_STORAGE_BUCKET"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "REPLACE_WITH_YOUR_FIREBASE_MESSAGING_SENDER_ID"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_WITH_YOUR_FIREBASE_APP_ID"
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
